<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games · Project Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 0.5rem; }
    .back { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: #38bdf8; text-decoration: underline; }
    
    /* Stats Bar */
    .stats-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-family: ui-monospace, monospace;
    }
    .stat-chip span { color: #38bdf8; font-weight: 600; }

    .list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1rem; }
    .game-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s, border-color 0.2s;
    }
    .game-card:hover { transform: translateY(-2px); border-color: #38bdf8; }
    .game-card h2 { font-size: 1.15rem; color: #f1f5f9; margin-bottom: 0.25rem; }
    .game-card p { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <a href="../" class="back">&larr; Back to Home</a>
    <h1 style="margin-top: 1rem;">Web Games</h1>
  </header>

  <!-- Global & Individual Stats Bar -->
  <div class="stats-bar">
    <div class="stat-chip">Total Played: <span id="total-matches">Loading...</span></div>
    <div class="stat-chip">Quartet Clash: <span id="qc-matches">...</span></div>
    <div class="stat-chip">Find the Thief: <span id="ftt-matches">...</span></div>
  </div>

  <div class="list">
    <a href="./quartet-clash/" class="game-card">
      <h2>🃏 Quartet Clash</h2>
      <p>Fast-paced card game showdown. Playable in the browser.</p>
    </a>

    <a href="./find-the-thief/" class="game-card">
      <h2>🕵️ Find the Thief</h2>
      <p>A deduction and investigation mini-game.</p>
    </a>
  </div>

<script>
    async function fetchAllStats() {
      let qcCount = 0;
      let fttCount = 0;

      try {
        // Fetch Quartet Clash count
        const resQC = await fetch('https://countapi.mileshilliard.com/api/v1/get/project_hub_quartet_clash');
        if (resQC.ok) {
          const dataQC = await resQC.json();
          qcCount = parseInt(dataQC.value || 0, 10);
        }
      } catch (e) {
        console.log("Quartet Clash fetch failed");
      }

      try {
        // Fetch Find the Thief count
        const resFTT = await fetch('https://countapi.mileshilliard.com/api/v1/get/project_hub_find_the_thief');
        if (resFTT.ok) {
          const dataFTT = await resFTT.json();
          fttCount = parseInt(dataFTT.value || 0, 10);
        }
      } catch (e) {
        console.log("Find the Thief fetch failed");
      }

      // Display the numbers instantly
      document.getElementById('qc-matches').textContent = qcCount;
      document.getElementById('ftt-matches').textContent = fttCount;
      document.getElementById('total-matches').textContent = qcCount + fttCount;
    }

    fetchAllStats();
  </script>
</body>
</html>
