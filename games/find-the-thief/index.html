<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown & Conclave - Find the Thief (v1.5.2)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        @keyframes shimmerSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        @keyframes radarRing {
            0% { transform: scale(0.95); opacity: 0.7; }
            70% { transform: scale(1.06); opacity: 0; }
            100% { transform: scale(1.06); opacity: 0; }
        }
        .animate-float-slow {
            animation: floatSlow 2.6s ease-in-out infinite;
        }
        .animate-shimmer {
            animation: shimmerSlide 2.2s infinite;
        }
        .animate-radar {
            animation: radarRing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebase = {
            initializeApp,
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            getFirestore,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            onSnapshot
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <!-- Main React Application -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const APP_VERSION = "v1.5.2";
        const BUILD_DATE = "2026-10-25";

        // Pure React SVG Icon Component (Eliminates DOM mutation conflicts with React)
        function Icon({ name, className = "w-5 h-5" }) {
            const props = {
                className,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round"
            };

            switch (name) {
                case 'crown':
                    return (
                        <svg {...props}>
                            <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" />
                            <path d="M5 21h14" />
                        </svg>
                    );
                case 'sparkles':
                case 'sparkle':
                    return (
                        <svg {...props}>
                            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
                        </svg>
                    );
                case 'shield':
                    return (
                        <svg {...props}>
                            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                        </svg>
                    );
                case 'swords':
                    return (
                        <svg {...props}>
                            <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
                            <line x1="13" x2="19" y1="19" y2="13" />
                            <line x1="16" x2="20" y1="16" y2="20" />
                            <line x1="19" x2="21" y1="21" y2="19" />
                            <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" />
                            <line x1="5" x2="9" y1="14" y2="18" />
                            <line x1="7" x2="4" y1="17" y2="20" />
                            <line x1="3" x2="5" y1="19" y2="21" />
                        </svg>
                    );
                case 'castle':
                    return (
                        <svg {...props}>
                            <path d="M22 20v-9H2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2Z" />
                            <path d="M18 11V4H6v7" />
                            <path d="M15 22v-4a3 3 0 0 0-3-3v0a3 3 0 0 0-3 3v4" />
                            <path d="M22 11V9" />
                            <path d="M2 11V9" />
                            <path d="M6 4V2" />
                            <path d="M18 4V2" />
                            <path d="M10 4V2" />
                            <path d="M14 4V2" />
                        </svg>
                    );
                case 'footprints':
                    return (
                        <svg {...props}>
                            <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" />
                            <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" />
                            <path d="M16 17h4" />
                            <path d="M4 13h4" />
                        </svg>
                    );
                case 'skull':
                    return (
                        <svg {...props}>
                            <circle cx="9" cy="12" r="1" />
                            <circle cx="15" cy="12" r="1" />
                            <path d="M8 20v2h8v-2" />
                            <path d="m12.5 17-.5-1-.5 1h1z" />
                            <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20" />
                        </svg>
                    );
                case 'users':
                    return (
                        <svg {...props}>
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                    );
                case 'copy':
                    return (
                        <svg {...props}>
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                        </svg>
                    );
                case 'check':
                    return (
                        <svg {...props}>
                            <path d="M20 6 9 17l-5-5" />
                        </svg>
                    );
                case 'play':
                    return (
                        <svg {...props}>
                            <polygon points="6 3 20 12 6 21 6 3" />
                        </svg>
                    );
                case 'rotate-ccw':
                    return (
                        <svg {...props}>
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                            <path d="M3 3v5h5" />
                        </svg>
                    );
                case 'bot':
                    return (
                        <svg {...props}>
                            <path d="M12 8V4H8" />
                            <rect width="16" height="12" x="4" y="8" rx="2" />
                            <path d="M2 14h2" />
                            <path d="M20 14h2" />
                            <path d="M15 13v2" />
                            <path d="M9 13v2" />
                        </svg>
                    );
                case 'trophy':
                    return (
                        <svg {...props}>
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                            <path d="M4 22h16" />
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
                        </svg>
                    );
                case 'arrow-right-left':
                    return (
                        <svg {...props}>
                            <path d="m16 3 4 4-4 4" />
                            <path d="M20 7H4" />
                            <path d="m8 21-4-4 4-4" />
                            <path d="M4 17h16" />
                        </svg>
                    );
                case 'help-circle':
                    return (
                        <svg {...props}>
                            <circle cx="12" cy="12" r="10" />
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                            <path d="M12 17h.01" />
                        </svg>
                    );
                case 'log-out':
                    return (
                        <svg {...props}>
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" x2="9" y1="12" y2="12" />
                        </svg>
                    );
                case 'eye':
                    return (
                        <svg {...props}>
                            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    );
                case 'lock':
                    return (
                        <svg {...props}>
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    );
                case 'alert-circle':
                    return (
                        <svg {...props}>
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" x2="12" y1="8" y2="12" />
                            <line x1="12" x2="12.01" y1="16" y2="16" />
                        </svg>
                    );
                case 'ban':
                    return (
                        <svg {...props}>
                            <circle cx="12" cy="12" r="10" />
                            <path d="m4.9 4.9 14.2 14.2" />
                        </svg>
                    );
                case 'brain':
                    return (
                        <svg {...props}>
                            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
                            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
                            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
                        </svg>
                    );
                case 'check-circle-2':
                    return (
                        <svg {...props}>
                            <circle cx="12" cy="12" r="10" />
                            <path d="m9 12 2 2 4-4" />
                        </svg>
                    );
                case 'search':
                    return (
                        <svg {...props}>
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    );
                default:
                    return (
                        <svg {...props}>
                            <circle cx="12" cy="12" r="10" />
                        </svg>
                    );
            }
        }

        const EXTRA_MIDDLE_ROLES = [
            { id: 'BISHOP', name: 'Bishop', pts: 800, color: 'from-purple-500 to-indigo-700', border: 'border-purple-400', text: 'text-purple-300', badge: 'bg-purple-950/80 text-purple-300 border-purple-500/40' },
            { id: 'KNIGHT', name: 'Knight', pts: 700, color: 'from-blue-500 to-blue-700', border: 'border-blue-400', text: 'text-blue-300', badge: 'bg-blue-950/80 text-blue-300 border-blue-500/40' },
            { id: 'ROOK', name: 'Rook', pts: 600, color: 'from-cyan-500 to-teal-700', border: 'border-cyan-400', text: 'text-cyan-300', badge: 'bg-cyan-950/80 text-cyan-300 border-cyan-500/40' },
            { id: 'DUKE', name: 'Duke', pts: 500, color: 'from-emerald-500 to-green-700', border: 'border-emerald-400', text: 'text-emerald-300', badge: 'bg-emerald-950/80 text-emerald-300 border-emerald-500/40' },
            { id: 'BARON', name: 'Baron', pts: 450, color: 'from-lime-500 to-green-800', border: 'border-lime-400', text: 'text-lime-300', badge: 'bg-lime-950/80 text-lime-300 border-lime-500/40' },
            { id: 'SQUIRE', name: 'Squire', pts: 400, color: 'from-teal-400 to-emerald-800', border: 'border-teal-400', text: 'text-teal-300', badge: 'bg-teal-950/80 text-teal-300 border-teal-500/40' }
        ];

        function getRoleHierarchy(playerCount) {
            const count = Math.max(4, Math.min(10, playerCount));
            const roles = [
                { id: 'KING', name: 'King', pts: 1000, color: 'from-amber-400 via-yellow-500 to-amber-600', border: 'border-amber-300', text: 'text-amber-300', badge: 'bg-amber-950/80 text-amber-300 border-amber-500/40' },
                { id: 'QUEEN', name: 'Queen', pts: 900, color: 'from-pink-500 via-rose-500 to-pink-700', border: 'border-pink-300', text: 'text-pink-300', badge: 'bg-pink-950/80 text-pink-300 border-pink-500/40' }
            ];

            const middleNeeded = count - 4;
            for (let i = 0; i < middleNeeded; i++) {
                roles.push(EXTRA_MIDDLE_ROLES[i]);
            }

            roles.push({ id: 'PAWN', name: 'Pawn', pts: 300, color: 'from-slate-500 to-slate-700', border: 'border-slate-300', text: 'text-slate-200', badge: 'bg-slate-800 text-slate-200 border-slate-500/40' });
            roles.push({ id: 'THIEF', name: 'Thief', pts: 0, color: 'from-red-600 via-rose-800 to-slate-900', border: 'border-red-500', text: 'text-red-400', badge: 'bg-red-950/80 text-red-300 border-red-500/40' });

            return roles.map((r, idx) => ({ ...r, order: idx }));
        }

        function RoleIcon({ roleId, className = "w-6 h-6" }) {
            switch (roleId) {
                case 'KING': return <Icon name="crown" className={className} />;
                case 'QUEEN': return <Icon name="sparkles" className={className} />;
                case 'BISHOP': return <Icon name="shield" className={className} />;
                case 'KNIGHT': return <Icon name="swords" className={className} />;
                case 'ROOK':
                case 'DUKE':
                case 'BARON':
                case 'SQUIRE': return <Icon name="castle" className={className} />;
                case 'PAWN': return <Icon name="footprints" className={className} />;
                case 'THIEF': return <Icon name="skull" className={className} />;
                default: return <Icon name="crown" className={className} />;
            }
        }

        const BOT_NAMES = ["Alex", "Sarah", "David", "Jessica", "Michael", "Emily", "Chris", "Amanda"];

        function App() {
            const [user, setUser] = useState(null);
            const [playerName, setPlayerName] = useState('');
            const [roomInput, setRoomInput] = useState('');
            const [activeRoomCode, setActiveRoomCode] = useState('');
            const [roomData, setRoomData] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [copied, setCopied] = useState(false);
            const [showRules, setShowRules] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [firebaseReady, setFirebaseReady] = useState(false);

            useEffect(() => {
                const handleFirebaseLoaded = () => {
                    const firebaseConfig = typeof __firebase_config !== 'undefined'
                        ? JSON.parse(__firebase_config)
                        : { apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project" };

                    const app = window.firebase.initializeApp(firebaseConfig);
                    window.auth = window.firebase.getAuth(app);
                    window.db = window.firebase.getFirestore(app);
                    window.appId = typeof __app_id !== 'undefined' ? __app_id : 'find-the-thief-app';

                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await window.firebase.signInWithCustomToken(window.auth, __initial_auth_token);
                            } else {
                                await window.firebase.signInAnonymously(window.auth);
                            }
                        } catch (err) {
                            console.error("Auth init error:", err);
                        }
                    };
                    initAuth();

                    window.firebase.onAuthStateChanged(window.auth, (currentUser) => {
                        setUser(currentUser);
                        setFirebaseReady(true);
                    });
                };

                if (window.firebase) {
                    handleFirebaseLoaded();
                } else {
                    window.addEventListener('firebase-loaded', handleFirebaseLoaded);
                }
            }, []);

            useEffect(() => {
                if (!user || !activeRoomCode || !window.db) return;

                const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoomCode);
                const unsubscribe = window.firebase.onSnapshot(
                    roomRef,
                    (snapshot) => {
                        if (snapshot.exists()) {
                            setRoomData(snapshot.data());
                        } else {
                            setErrorMsg('Room no longer exists.');
                            setActiveRoomCode('');
                            setRoomData(null);
                        }
                    },
                    (err) => {
                        console.error("Firestore error:", err);
                        setErrorMsg('Connection issue with game room.');
                    }
                );

                return () => unsubscribe();
            }, [user, activeRoomCode]);

            useEffect(() => {
                if (!user || !roomData || roomData.status !== 'PLAYING') return;
                if (roomData.hostId !== user.uid) return;

                const hierarchy = getRoleHierarchy(roomData.players.length);
                const currentSeekerRole = hierarchy[roomData.currentStep];
                if (!currentSeekerRole) return;

                const seekerPlayer = roomData.players.find(p => p.roleId === currentSeekerRole.id);
                if (!seekerPlayer || !seekerPlayer.isBot) return;

                const timer = setTimeout(() => {
                    const stepExcludedIds = roomData.stepExcludedIds || [];
                    const eligibleTargets = roomData.players.filter(
                        p => !roomData.lockedPlayerIds.includes(p.id) &&
                             p.id !== seekerPlayer.id &&
                             !stepExcludedIds.includes(p.id)
                    );
                    if (eligibleTargets.length > 0) {
                        const randomTarget = eligibleTargets[Math.floor(Math.random() * eligibleTargets.length)];
                        handleGuessPlayer(randomTarget.id, true);
                    }
                }, 1600);

                return () => clearTimeout(timer);
            }, [roomData, user]);

            const generateCode = () => {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let code = '';
                for (let i = 0; i < 5; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            };

            const handleCreateRoom = async (e) => {
                e.preventDefault();
                if (!user) return;
                const trimmedName = playerName.trim();
                if (!trimmedName) {
                    setErrorMsg('Please enter your display name first.');
                    return;
                }

                setIsSubmitting(true);
                setErrorMsg('');
                try {
                    const code = generateCode();
                    const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', code);

                    const initialPlayers = [{
                        id: user.uid,
                        name: trimmedName,
                        score: 0,
                        roleId: null,
                        isBot: false
                    }];

                    await window.firebase.setDoc(roomRef, {
                        code,
                        hostId: user.uid,
                        status: 'LOBBY',
                        round: 1,
                        currentStep: 0,
                        players: initialPlayers,
                        lockedPlayerIds: [],
                        stepExcludedIds: [],
                        lastAction: `${trimmedName} created the royal court!`,
                        lastSwap: null,
                        logs: [`🏰 ${trimmedName} opened room ${code}. Waiting for at least 4 players...`],
                        createdAt: Date.now()
                    });

                    setActiveRoomCode(code);
                } catch (err) {
                    console.error("Create room error:", err);
                    setErrorMsg('Could not create room. Please try again.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleJoinRoom = async (e) => {
                e.preventDefault();
                if (!user) return;
                const trimmedName = playerName.trim();
                const code = roomInput.trim().toUpperCase();

                if (!trimmedName) {
                    setErrorMsg('Please enter your display name first.');
                    return;
                }
                if (!code) {
                    setErrorMsg('Please enter a valid 5-letter room code.');
                    return;
                }

                setIsSubmitting(true);
                setErrorMsg('');
                try {
                    const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', code);
                    const snap = await window.firebase.getDoc(roomRef);

                    if (!snap.exists()) {
                        setErrorMsg(`Room "${code}" was not found.`);
                        setIsSubmitting(false);
                        return;
                    }

                    const data = snap.data();
                    const existingPlayer = data.players.find(p => p.id === user.uid);

                    if (!existingPlayer) {
                        if (data.status !== 'LOBBY') {
                            setErrorMsg('This room has already started a game.');
                            setIsSubmitting(false);
                            return;
                        }
                        if (data.players.length >= 10) {
                            setErrorMsg('This room is full (max 10 players).');
                            setIsSubmitting(false);
                            return;
                        }

                        const updatedPlayers = [
                            ...data.players,
                            { id: user.uid, name: trimmedName, score: 0, roleId: null, isBot: false }
                        ];

                        await window.firebase.updateDoc(roomRef, {
                            players: updatedPlayers,
                            lastAction: `${trimmedName} joined the court!`,
                            logs: [`👋 ${trimmedName} joined the room.`, ...(data.logs || []).slice(0, 25)]
                        });
                    }

                    setActiveRoomCode(code);
                } catch (err) {
                    console.error("Join room error:", err);
                    setErrorMsg('Failed to join the room. Check the code and try again.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleAddBot = async () => {
                if (!roomData || roomData.players.length >= 10) return;
                const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoomCode);

                const existingNames = roomData.players.map(p => p.name);
                const availableName = BOT_NAMES.find(n => !existingNames.includes(n)) || `Royal Bot ${roomData.players.length}`;
                const botPlayer = {
                    id: `bot_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
                    name: availableName,
                    score: 0,
                    roleId: null,
                    isBot: true
                };

                const updatedPlayers = [...roomData.players, botPlayer];
                await window.firebase.updateDoc(roomRef, {
                    players: updatedPlayers,
                    lastAction: `🤖 ${availableName} (AI) joined the court!`,
                    logs: [`🤖 ${availableName} (AI Bot) was added to the court.`, ...(roomData.logs || []).slice(0, 25)]
                });
            };

            const handleRemovePlayer = async (targetId) => {
                if (!roomData || roomData.status !== 'LOBBY') return;
                const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoomCode);
                const updatedPlayers = roomData.players.filter(p => p.id !== targetId);
                await window.firebase.updateDoc(roomRef, { players: updatedPlayers });
            };

            const handleStartRound = async (isNextRound = false) => {
                if (!roomData || roomData.players.length < 4) return;
                const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoomCode);

                const hierarchy = getRoleHierarchy(roomData.players.length);
                const shuffledRoles = [...hierarchy].sort(() => Math.random() - 0.5);

                const dealtPlayers = roomData.players.map((p, idx) => ({
                    ...p,
                    roleId: shuffledRoles[idx].id
                }));

                const kingPlayer = dealtPlayers.find(p => p.roleId === 'KING');
                const nextRoundNumber = isNextRound ? (roomData.round || 1) + 1 : (roomData.round || 1);

                await window.firebase.updateDoc(roomRef, {
                    status: 'PLAYING',
                    round: nextRoundNumber,
                    currentStep: 0,
                    players: dealtPlayers,
                    lockedPlayerIds: [],
                    stepExcludedIds: [],
                    lastSwap: null,
                    lastAction: `Round ${nextRoundNumber} begun! ${kingPlayer?.name} drew the KING card and must find the QUEEN!`,
                    logs: [
                        `👑 Round ${nextRoundNumber}: Cards have been dealt! ${kingPlayer?.name} is the King and must guess who holds the Queen card.`,
                        ...(roomData.logs || []).slice(0, 25)
                    ]
                });
            };

            const handleGuessPlayer = async (guessedPlayerId, isBotMove = false) => {
                if (!roomData || roomData.status !== 'PLAYING') return;

                const hierarchy = getRoleHierarchy(roomData.players.length);
                const currentStep = roomData.currentStep;
                const seekerRole = hierarchy[currentStep];
                const targetRole = hierarchy[currentStep + 1];

                if (!seekerRole || !targetRole) return;

                const players = [...roomData.players];
                const seekerPlayer = players.find(p => p.roleId === seekerRole.id);
                const guessedPlayer = players.find(p => p.id === guessedPlayerId);

                if (!seekerPlayer || !guessedPlayer) return;

                if (!isBotMove && seekerPlayer.id !== user?.uid) return;
                if (roomData.lockedPlayerIds.includes(guessedPlayer.id)) return;
                if ((roomData.stepExcludedIds || []).includes(guessedPlayer.id)) return;
                if (seekerPlayer.id === guessedPlayer.id) return;

                const roomRef = window.firebase.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoomCode);
                const lockedPlayerIds = [...(roomData.lockedPlayerIds || [])];

                try {
                    if (guessedPlayer.roleId === targetRole.id) {
                        lockedPlayerIds.push(seekerPlayer.id);
                        let updatedPlayers = players.map(p => {
                            if (p.id === seekerPlayer.id) {
                                return { ...p, score: (p.score || 0) + seekerRole.pts };
                            }
                            return p;
                        });

                        let nextStep = currentStep + 1;
                        const isSecondToLastStep = nextStep === hierarchy.length - 2;
                        const isRoundComplete = nextStep >= hierarchy.length - 1 || isSecondToLastStep;

                        let newStatus = 'PLAYING';
                        let actionMessage = `✅ Correct! ${seekerPlayer.name} (${seekerRole.name}) found ${guessedPlayer.name} (${targetRole.name}) and scored +${seekerRole.pts} pts!`;
                        let newLogs = [actionMessage];

                        if (isSecondToLastStep) {
                            newStatus = 'ROUND_END';
                            const pawnRole = hierarchy[nextStep];
                            const thiefRole = hierarchy[nextStep + 1];
                            const thiefPlayer = players.find(p => !lockedPlayerIds.includes(p.id) && p.id !== guessedPlayer.id);

                            lockedPlayerIds.push(guessedPlayer.id);
                            if (thiefPlayer) lockedPlayerIds.push(thiefPlayer.id);

                            updatedPlayers = updatedPlayers.map(p => {
                                if (p.id === guessedPlayer.id) {
                                    return { ...p, score: (p.score || 0) + pawnRole.pts };
                                }
                                return p;
                            });

                            const autoEndMsg = `🎉 Round ${roomData.round} Complete! With 2 players left, ${guessedPlayer.name} is confirmed as ${pawnRole.name} (+${pawnRole.pts} pts) and ${thiefPlayer?.name || 'the last player'} is exposed as the ${thiefRole.name} (0 pts)!`;
                            newLogs.unshift(autoEndMsg);
                            actionMessage = `${actionMessage} ${autoEndMsg}`;
                            nextStep = hierarchy.length - 1;
                        } else if (isRoundComplete) {
                            newStatus = 'ROUND_END';
                            lockedPlayerIds.push(guessedPlayer.id);
                            const endMsg = `🎉 Round ${roomData.round} Complete! ${guessedPlayer.name} was caught as the Thief (0 pts)!`;
                            newLogs.unshift(endMsg);
                            actionMessage = endMsg;
                        } else {
                            const nextTargetRole = hierarchy[nextStep + 1];
                            newLogs.unshift(`🔎 Now ${guessedPlayer.name} (${targetRole.name}) must find the ${nextTargetRole.name}!`);
                        }

                        await window.firebase.updateDoc(roomRef, {
                            status: newStatus,
                            currentStep: nextStep,
                            players: updatedPlayers,
                            lockedPlayerIds,
                            stepExcludedIds: [],
                            lastSwap: {
                                type: 'SUCCESS',
                                fromName: seekerPlayer.name,
                                toName: guessedPlayer.name,
                                roleName: targetRole.name,
                                pts: seekerRole.pts,
                                timestamp: Date.now()
                            },
                            lastAction: actionMessage,
                            logs: [...newLogs, ...(roomData.logs || []).slice(0, 25)]
                        });
                    } else {
                        const seekerOldRole = seekerPlayer.roleId;
                        const guessedOldRole = guessedPlayer.roleId;

                        const updatedPlayers = players.map(p => {
                            if (p.id === seekerPlayer.id) return { ...p, roleId: guessedOldRole };
                            if (p.id === guessedPlayer.id) return { ...p, roleId: seekerOldRole };
                            return p;
                        });

                        const updatedExcludedIds = Array.from(new Set([...(roomData.stepExcludedIds || []), seekerPlayer.id]));

                        const swapMsg = `🔄 Wrong guess! ${seekerPlayer.name} guessed ${guessedPlayer.name}, who is NOT the ${targetRole.name}. They swapped cards! ${guessedPlayer.name} is now the ${seekerRole.name} (${seekerPlayer.name} is ruled out as ${targetRole.name}).`;

                        await window.firebase.updateDoc(roomRef, {
                            players: updatedPlayers,
                            stepExcludedIds: updatedExcludedIds,
                            lastSwap: {
                                type: 'SWAP',
                                fromName: seekerPlayer.name,
                                toName: guessedPlayer.name,
                                seekerRoleName: seekerRole.name,
                                targetRoleName: targetRole.name,
                                timestamp: Date.now()
                            },
                            lastAction: swapMsg,
                            logs: [swapMsg, ...(roomData.logs || []).slice(0, 25)]
                        });
                    }
                } catch (err) {
                    console.error("Error processing guess:", err);
                }

                                                            <span>{p.name}</span>
                                                            {p.id === user?.uid && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">You</span>}
                                                            {p.id === roomData.hostId && <span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">Host</span>}
                                                        </div>
                                                        <div className="text-xs text-slate-500">{p.isBot ? 'Royal AI Opponent' : 'Human Player'}</div>
                                                    </div>
                                                </div>

                                                {isHost && p.id !== user?.uid && (
                                                    <button onClick={() => handleRemovePlayer(p.id)} className="text-xs text-slate-500 hover:text-red-400 px-2 py-1 rounded-lg hover:bg-slate-900 transition">Remove</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    {!isHost && (
                                        <div className="text-center py-3 px-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-slate-400">
                                            Waiting for the Host to start the game ({roomData.players.length < 4 ? `Need ${4 - roomData.players.length} more player(s)` : 'Ready to start!'})...
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 sm:p-5 shadow-xl space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold uppercase tracking-wider text-slate-200">Royal Deduction Progress</span>
                                                <span className="px-2 py-0.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 font-bold">{progressPercent}%</span>
                                            </div>
                                            <span>Step {Math.min(roomData.currentStep + 1, hierarchy.length - 1)} of {hierarchy.length - 1}</span>
                                        </div>

                                        <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800 relative">
                                            <div className="h-full bg-gradient-to-r from-amber-400 via-pink-500 to-emerald-400 transition-all duration-700 ease-out relative overflow-hidden" style={{ width: `${progressPercent}%` }}>
                                                <div className="absolute inset-0 w-1/2 bg-gradient-to-r from-transparent via-white/30 to-transparent animate-shimmer" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1">
                                            <div className="p-2.5 rounded-2xl bg-amber-950/30 border border-amber-500/30 flex items-center gap-2.5">
                                                <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
                                                    <Icon name="brain" className={`w-4 h-4 ${roomData.status === 'PLAYING' ? 'animate-pulse' : ''}`} />
                                                </div>
                                                <div className="min-w-0">
                                                    <div className="text-[10px] uppercase tracking-wider text-amber-300/80 font-bold">{roomData.status === 'PLAYING' ? 'Thinking Now' : 'Round Status'}</div>
                                                    <div className="text-xs font-extrabold text-white truncate">{roomData.status === 'PLAYING' ? currentSeekerPlayer?.name || 'Seeker' : 'All Resolved'}</div>
                                                </div>
                                            </div>

                                            <div className="p-2.5 rounded-2xl bg-pink-950/30 border border-pink-500/30 flex items-center gap-2.5">
                                                <div className="w-8 h-8 rounded-xl bg-pink-500/20 text-pink-400 flex items-center justify-center shrink-0">
                                                    <Icon name="search" className="w-4 h-4" />
                                                </div>
                                                <div>
                                                    <div className="text-[10px] uppercase tracking-wider text-pink-300/80 font-bold">Left to Guess</div>
                                                    <div className="text-xs font-extrabold text-white">{roomData.status === 'PLAYING' ? `${suspectsLeftCount} Suspects` : '0 Remaining'}</div>
                                                </div>
                                            </div>

                                            <div className="p-2.5 rounded-2xl bg-emerald-950/30 border border-emerald-500/30 flex items-center gap-2.5">
                                                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                                                    <Icon name="lock" className="w-4 h-4" />
                                                </div>
                                                <div>
                                                    <div className="text-[10px] uppercase tracking-wider text-emerald-300/80 font-bold">Scores Locked</div>
                                                    <div className="text-xs font-extrabold text-white">{lockedCount} / {roomData.players.length} Players</div>
                                                </div>
                                            </div>

                                            <div className="p-2.5 rounded-2xl bg-rose-950/30 border border-rose-500/30 flex items-center gap-2.5">
                                                <div className="w-8 h-8 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center shrink-0">
                                                    <Icon name="ban" className="w-4 h-4" />
                                                </div>
                                                <div>
                                                    <div className="text-[10px] uppercase tracking-wider text-rose-300/80 font-bold">Ruled Out</div>
                                                    <div className="text-xs font-extrabold text-white">{excludedCount} Players</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                                            {hierarchy.map((role, idx) => {
                                                const isCompleted = idx < roomData.currentStep || roomData.status === 'ROUND_END';
                                                const isCurrentSeeker = roomData.status === 'PLAYING' && idx === roomData.currentStep;
                                                const isCurrentTarget = roomData.status === 'PLAYING' && idx === roomData.currentStep + 1;

                                                return (
                                                    <React.Fragment key={role.id}>
                                                        <div className={`px-3 py-2 rounded-xl border text-xs font-bold flex items-center gap-1.5 shrink-0 transition-all duration-300 ${
                                                            isCurrentSeeker ? 'bg-amber-500 text-slate-950 border-amber-300 shadow-lg shadow-amber-500/25 scale-105' :
                                                            isCurrentTarget ? 'bg-pink-500/20 text-pink-300 border-pink-400 animate-pulse' :
                                                            isCompleted ? 'bg-emerald-950/70 text-emerald-300 border-emerald-500/40' :
                                                            'bg-slate-950 text-slate-500 border-slate-800'
                                                        }`}>
                                                            {isCompleted ? <Icon name="check-circle-2" className="w-3.5 h-3.5 text-emerald-400" /> : <RoleIcon roleId={role.id} className="w-3.5 h-3.5" />}
                                                            <span>{role.name}</span>
                                                            <span className="text-[10px] opacity-80">({role.pts})</span>
                                                        </div>
                                                        {idx < hierarchy.length - 1 && <span className={`text-xs font-bold shrink-0 ${isCompleted ? 'text-emerald-500' : 'text-slate-600'}`}>→</span>}
                                                    </React.Fragment>
                                                );
                                            })}
                                        </div>

                                        <div className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex flex-wrap items-center justify-between gap-3">
                                            <div className="flex items-center gap-3">
                                                {roomData.status === 'PLAYING' ? (
                                                    <div className="relative w-11 h-11 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-400 flex items-center justify-center shrink-0">
                                                        <span className="absolute inset-0 rounded-xl border border-amber-400/50 animate-ping opacity-30" />
                                                        <Icon name="eye" className="w-5 h-5" />
                                                    </div>
                                                ) : (
                                                    <div className="w-11 h-11 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 flex items-center justify-center shrink-0">
                                                        <Icon name="trophy" className="w-5 h-5 animate-bounce" />
                                                    </div>
                                                )}
                                                <div>
                                                    {roomData.status === 'PLAYING' && currentSeekerRole && currentTargetRole ? (
                                                        <>
                                                            <div className="text-sm font-bold text-white flex flex-wrap items-center gap-2">
                                                                <span><span className="text-amber-400">{currentSeekerPlayer?.name}</span> ({currentSeekerRole.name}) is searching for the <span className="text-pink-400 underline decoration-pink-400">{currentTargetRole.name}</span></span>
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-0.5">
                                                                {isMyTurnToGuess ? `👉 YOUR TURN! Select one of the ${suspectsLeftCount} eligible suspect cards below.` : `Observing ${currentSeekerPlayer?.name} evaluate suspects...`}
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <div className="text-sm font-bold text-emerald-400">Round {roomData.round} Complete! All cards and scores are locked below.</div>
                                                            <div className="text-xs text-slate-400">{roomData.lastAction}</div>
                                                        </>
                                                    )}
                                                </div>
                                            </div>

                                            {roomData.status === 'ROUND_END' && isHost && (
                                                <button onClick={() => handleStartRound(true)} className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-extrabold text-xs shadow-lg shadow-amber-500/20 flex items-center gap-1.5 transition">
                                                    <Icon name="rotate-ccw" className="w-4 h-4" />
                                                    <span>Deal Next Round</span>
                                                </button>
                                            )}
                                        </div>

                                        {roomData.lastSwap && (
                                            <div className={`px-4 py-2.5 rounded-xl border text-xs font-medium flex items-center gap-2 ${roomData.lastSwap.type === 'SWAP' ? 'bg-rose-950/50 border-rose-500/40 text-rose-200' : 'bg-emerald-950/50 border-emerald-500/40 text-emerald-200'}`}>
                                                <Icon name="arrow-right-left" className="w-4 h-4 shrink-0" />
                                                <span>{roomData.lastAction}</span>
                                            </div>
                                        )}
                                    </div>

                                    {myPlayer && myRole && (
                                        <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
                                            <div className="flex items-center gap-4">
                                                <div className={`w-14 h-16 rounded-2xl bg-gradient-to-br ${myRole.color} border-2 ${myRole.border} flex flex-col items-center justify-center text-white shadow-lg`}>
                                                    <RoleIcon roleId={myRole.id} className="w-6 h-6" />
                                                    <span className="text-[10px] font-black uppercase mt-0.5">{myRole.name}</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs font-semibold uppercase tracking-wider text-slate-400">Your Current Card</div>
                                                    <div className="text-lg font-black text-white flex items-center gap-2">
                                                        <span>{myRole.name}</span>
                                                        <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-amber-300 border border-slate-700">Worth {myRole.pts} pts</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
                                        {roomData.players.map((p) => {
                                            const pRole = hierarchy.find(r => r.id === p.roleId);
                                            const isLocked = roomData.lockedPlayerIds?.includes(p.id);
                                            const isActiveSeeker = roomData.status === 'PLAYING' && currentSeekerPlayer?.id === p.id;
                                            const isMe = p.id === user?.uid;
                                            const isRoleRevealed = isMe || isLocked || isActiveSeeker || roomData.status === 'ROUND_END';
                                            const isExcludedThisStep = roomData.status === 'PLAYING' && (roomData.stepExcludedIds || []).includes(p.id);
                                            const isEligibleSuspect = roomData.status === 'PLAYING' && !isLocked && !isActiveSeeker && !isExcludedThisStep;
                                            const canBeGuessed = isMyTurnToGuess && isEligibleSuspect && !isMe;

                                            return (
                                                <div
                                                    key={p.id}
                                                    onClick={() => canBeGuessed && handleGuessPlayer(p.id, false)}
                                                    className={`relative rounded-3xl p-4 border transition-all duration-300 flex flex-col justify-between min-h-[205px] overflow-hidden ${
                                                        isActiveSeeker ? 'bg-gradient-to-b from-amber-950/60 via-slate-900 to-slate-900 border-amber-400 shadow-xl shadow-amber-500/15 ring-2 ring-amber-400/30' :
                                                        isLocked ? 'bg-gradient-to-b from-emerald-950/35 to-slate-900/90 border-emerald-500/50 shadow-lg' :
                                                        isExcludedThisStep ? 'bg-slate-950/60 border-rose-500/30 opacity-60 cursor-not-allowed' :
                                                        canBeGuessed ? 'bg-slate-900 hover:bg-slate-800/95 border-pink-500/50 hover:border-pink-400 cursor-pointer hover:-translate-y-1.5 shadow-lg shadow-pink-500/10' :
                                                        'bg-slate-900/90 border-slate-800'
                                                    }`}
                                                >
                                                    <div className="flex items-start justify-between gap-2 relative z-10">
                                                        <div>
                                                            <div className="font-bold text-sm text-white flex items-center gap-1.5 flex-wrap">
                                                                <span>{p.name}</span>
                                                                {isMe && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">You</span>}
                                                                {p.isBot && <span className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-700/40">AI</span>}
                                                            </div>
                                                            <div className="text-xs text-slate-400 font-semibold mt-0.5 flex items-center gap-1.5">
                                                                <span>Score:</span>
                                                                <span className="text-amber-300 font-mono font-bold">{p.score || 0} pts</span>
                                                            </div>
                                                        </div>

                                                        {isLocked && (
                                                            <span className="px-2.5 py-1 rounded-xl bg-emerald-950 border border-emerald-500/50 text-emerald-300 text-[10px] font-extrabold flex items-center gap-1">
                                                                <Icon name="check-circle-2" className="w-3 h-3 text-emerald-400" />
                                                                <span>Locked</span>
                                                            </span>
                                                        )}
                                                        {isActiveSeeker && (
                                                            <span className="px-2.5 py-1 rounded-xl bg-amber-400 text-slate-950 text-[10px] font-black uppercase flex items-center gap-1">
                                                                <Icon name="brain" className="w-3 h-3 animate-spin" />
                                                                <span>Thinking</span>
                                                            </span>
                                                        )}
                                                        {!isLocked && !isActiveSeeker && isExcludedThisStep && (
                                                            <span className="px-2.5 py-1 rounded-xl bg-rose-950/90 border border-rose-500/40 text-rose-300 text-[10px] font-bold flex items-center gap-1">
                                                                <Icon name="ban" className="w-3 h-3" />
                                                                <span>Ruled Out</span>
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="my-3 flex items-center justify-center relative z-10">
                                                        {isRoleRevealed && pRole ? (
                                                            <div className={`w-full py-3 px-4 rounded-2xl bg-gradient-to-r ${pRole.color} border ${pRole.border} text-white flex items-center justify-between shadow-inner relative overflow-hidden`}>
                                                                <div className="flex items-center gap-2.5">
                                                                    <RoleIcon roleId={pRole.id} className="w-6 h-6" />
                                                                    <div>
                                                                        <div className="font-black text-sm tracking-wide uppercase">{pRole.name}</div>
                                                                        <div className="text-[11px] opacity-90">{pRole.pts} Points</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className={`w-full py-3.5 px-4 rounded-2xl bg-slate-950 border flex items-center justify-between text-slate-400 ${canBeGuessed ? 'border-pink-500/40 bg-pink-950/10' : 'border-slate-800'}`}>
                                                                <div className="flex items-center gap-2.5">
                                                                    <div className={`w-8 h-8 rounded-xl border flex items-center justify-center font-bold ${isEligibleSuspect ? 'bg-pink-500/15 border-pink-500/40 text-pink-300 animate-pulse' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>?</div>
                                                                    <div>
                                                                        <div className="font-bold text-xs text-slate-200">{isEligibleSuspect ? 'Unrevealed Suspect' : 'Hidden Card'}</div>
                                                                        <div className="text-[11px] text-slate-500">{isExcludedThisStep ? 'Ruled out' : 'Suspect'}</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="relative z-10">
                                                        {canBeGuessed ? (
                                                            <button type="button" className="w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-slate-950 font-extrabold text-xs transition flex items-center justify-center gap-1.5 shadow-lg">
                                                                <Icon name="sparkle" className="w-3.5 h-3.5 fill-current" />
                                                                <span>Guess as {currentTargetRole?.name}</span>
                                                            </button>
                                                        ) : isExcludedThisStep ? (
                                                            <div className="text-center text-[11px] text-rose-400 font-semibold py-1">Proven Not {currentTargetRole?.name}</div>
                                                        ) : isLocked ? (
                                                            <div className="text-center text-[11px] text-emerald-400 font-semibold py-1">Locked as {pRole?.name}</div>
                                                        ) : (
                                                            <div className="text-center text-[11px] text-slate-400 py-1">Waiting in court</div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 className="font-extrabold text-sm uppercase tracking-wider text-amber-400 flex items-center gap-2">
                                        <Icon name="trophy" className="w-4 h-4" />
                                        <span>Royal Standings</span>
                                    </h3>
                                    <span className="text-xs text-slate-500">Total Points</span>
                                </div>

                                <div className="space-y-2">
                                    {[...roomData.players]
                                        .sort((a, b) => (b.score || 0) - (a.score || 0))
                                        .map((p, index) => {
                                            const isPlayerLocked = roomData.lockedPlayerIds?.includes(p.id);
                                            const isPlayerSeeking = roomData.status === 'PLAYING' && currentSeekerPlayer?.id === p.id;

                                            return (
                                                <div key={p.id} className={`flex items-center justify-between px-3.5 py-2.5 rounded-2xl border transition-all ${isPlayerSeeking ? 'bg-amber-950/30 border-amber-500/40' : isPlayerLocked ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-slate-950/90 border-slate-800/80'}`}>
                                                    <div className="flex items-center gap-2.5 min-w-0">
                                                        <span className={`w-6 h-6 rounded-lg text-xs font-black flex items-center justify-center shrink-0 ${index === 0 ? 'bg-amber-400 text-slate-950' : index === 1 ? 'bg-slate-300 text-slate-950' : index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                            {index + 1}
                                                        </span>
                                                        <div className="min-w-0">
                                                            <div className="text-sm font-bold text-white truncate flex items-center gap-1.5">
                                                                <span className="truncate">{p.name}</span>
                                                                {isPlayerLocked && <Icon name="lock" className="w-3 h-3 text-emerald-400 shrink-0" />}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <span className="font-mono font-extrabold text-sm text-amber-300 shrink-0">{p.score || 0} pts</span>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>

                            <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3">
                                <div className="border-b border-slate-800 pb-3 flex items-center justify-between">
                                    <h3 className="font-extrabold text-sm uppercase tracking-wider text-slate-300">Court Chronicle</h3>
                                    <span className="text-[11px] text-slate-500">Live Swaps & Finds</span>
                                </div>

                                <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                    {(roomData.logs || []).map((entry, idx) => (
                                        <div key={idx} className="text-xs leading-relaxed p-2.5 rounded-xl bg-slate-950/80 border border-slate-800/80 text-slate-300">
                                            {entry}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    {showRules && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-amber-400 flex items-center gap-2">
                                        <Icon name="crown" className="w-5 h-5" />
                                        <span>How to Play Find the Thief</span>
                                    </h3>
                                    <button onClick={() => setShowRules(false)} className="text-slate-400 hover:text-white text-sm px-2 py-1 rounded-lg bg-slate-800">Close</button>
                                </div>
                                <ul className="space-y-2.5 text-sm text-slate-300 list-disc pl-5">
                                    <li><strong>Rank Order:</strong> King (1000) → Queen (900) → Bishop (800) → ... → Pawn (300) → Thief (0).</li>
                                    <li><strong>Correct Guess:</strong> Seeker scores points and locks in their card.</li>
                                    <li><strong>Wrong Guess & Swap:</strong> Seeker and suspect exchange cards! The previous seeker is ruled out for that rank.</li>
                                    <li><strong>Final 2 Deduction:</strong> When only 2 players remain unlocked (Pawn & Thief), the round ends automatically.</li>
                                </ul>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
