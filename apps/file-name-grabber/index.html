<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Name Grabber</title>
  <style>
    :root {
      /* Surfaces & Backgrounds */
      --bg: #090d16;
      --card-bg: #111726;
      --card-hover: #172033;
      --card-active: #1e293b;

      /* Borders & Dividers */
      --border: #1e293b;
      --border-focus: #3b82f6;

      /* Typography */
      --text: #f1f5f9;
      --text-muted: #64748b;

      /* Primary Brand Accents */
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #60a5fa;

      /* Semantic Alerts */
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;

      /* Geometry & Typography System */
      --radius: 8px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    /* Top Navigation bar */
    .top-nav {
      max-width: 800px;
      width: 100%;
      margin: 0 auto 1.5rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .top-nav a {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s ease;
    }

    .top-nav a:hover {
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* Drop Zone / File Input */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 1.5rem;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--border-focus);
      background: var(--card-hover);
    }

    .drop-zone p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    .drop-zone strong {
      color: var(--accent-light);
    }

    input[type="file"] {
      display: none;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
      user-select: none;
    }

    /* Custom Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:focus + .slider {
      box-shadow: 0 0 1px var(--border-focus);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .file-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Output Section */
    .output-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-header label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }

    textarea {
      width: 100%;
      height: 140px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: var(--border-focus);
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn.success {
      background-color: var(--success);
    }
  </style>
</head>
<body>

  <!-- Top Navigation with Home & Page Links -->
<nav class="top-nav">
    <a href="../../">&larr; Back to Home</a>
    <div class="nav-links">
      <a href="../../games/">🎮 Games</a>
      <a href="../../apps/">⚡ Apps</a>
      <a href="../../wallpapers/">🖼️ Wallpapers</a>
      <a href="../../blogs/">📝 Blog</a>
    </div>
  </nav>

  <div class="container">
    <h1>File Name Grabber</h1>
    <p class="subtitle">Drop or select files to instantly generate a sorted, comma-separated list of filenames.</p>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--accent-light); margin: 0 auto 0.5rem auto; display: block;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <p>Drag & drop files here, or <strong>browse files</strong></p>
      <input type="file" id="fileInput" multiple>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label class="toggle-label">
        <span class="switch">
          <!-- Default unchecked (off) -->
          <input type="checkbox" id="includeExtToggle" onchange="processFiles()">
          <span class="slider"></span>
        </span>
        Include filename extension
      </label>
      <div class="file-count" id="fileCount">0 files loaded</div>
    </div>

    <!-- Output -->
    <div class="output-section">
      <div class="output-header">
        <label for="outputResult">Concatenated Result</label>
        <button class="btn" id="copyBtn" onclick="copyResult()">Copy to Clipboard</button>
      </div>
      <textarea id="outputResult" readonly placeholder="Sorted file names will appear here..."></textarea>
    </div>
  </div>

  <script>
    let loadedFiles = [];

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const includeExtToggle = document.getElementById('includeExtToggle');
    const outputResult = document.getElementById('outputResult');
    const fileCount = document.getElementById('fileCount');
    const copyBtn = document.getElementById('copyBtn');

    // Drag and drop events
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      handleFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      if (!files || files.length === 0) return;
      loadedFiles = Array.from(files);
      processFiles();
    }

    function processFiles() {
      if (loadedFiles.length === 0) {
        outputResult.value = '';
        fileCount.textContent = '0 files loaded';
        return;
      }

      const includeExt = includeExtToggle.checked;

      // Extract names
      let names = loadedFiles.map(file => {
        let fullName = file.name;
        if (!includeExt) {
          const lastDotIndex = fullName.lastIndexOf('.');
          if (lastDotIndex > 0) {
            return fullName.substring(0, lastDotIndex);
          }
        }
        return fullName;
      });

      // Sort alphabetically (case-insensitive & natural numeric sorting)
      names.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'accent', numeric: true }));

      // Join with comma and space
      outputResult.value = names.join(', ');
      fileCount.textContent = `${loadedFiles.length} file${loadedFiles.length === 1 ? '' : 's'} loaded`;
    }

    function copyResult() {
      if (!outputResult.value) return;
      navigator.clipboard.writeText(outputResult.value).then(() => {
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = 'Copied!';
        copyBtn.classList.add('success');
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.classList.remove('success');
        }, 2000);
      });
    }
  </script>
</body>
</html>
