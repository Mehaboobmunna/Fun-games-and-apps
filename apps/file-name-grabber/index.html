<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Name Grabber · Apps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #243248;
      --border: #334155;
      --border-focus: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 8px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .top-nav a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    .top-nav a:hover { text-decoration: underline; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }
    .logo-area h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .logo-area p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    /* Drop Zone */
    .drop-zone {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #38bdf8;
      background: var(--card-hover);
    }
    .drop-zone p { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }
    .drop-zone b { color: #38bdf8; }

    /* Controls Panel */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .checkbox-group {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-group input { accent-color: #38bdf8; cursor: pointer; }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-action { background: #0f172a; color: var(--text); border: 1px solid var(--border); }
    .btn-action:hover { background: #334155; border-color: #475569; }

    /* Output Section */
    .output-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      padding: 0 4px;
    }

    textarea {
      width: 100%;
      height: 320px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 14px;
      outline: none;
      resize: vertical;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--border-focus); }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <a href="../">&larr; Back to Apps Hub</a>
    </nav>

    <header>
      <div class="logo-area">
        <h1>File Name Grabber</h1>
        <p>Extract, clean, and format file names from your local folders instantly.</p>
      </div>
    </header>

    <!-- Drop Zone -->
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div style="font-size: 2rem;">📁</div>
      <p><b>Click to browse</b> or drag and drop files here</p>
      <input type="file" id="file-input" multiple style="display: none;" onchange="handleFiles(this.files)">
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="chk-extension" checked onchange="processFiles()"> Include extension
        </label>
        <label>
          <input type="checkbox" id="chk-sort" checked onchange="processFiles()"> Sort alphabetically
        </label>
      </div>
      <div class="action-buttons">
        <button class="btn-action" onclick="clearFiles()">Clear</button>
        <button class="btn-primary" onclick="copyToClipboard()">Copy to Clipboard</button>
        <button class="btn-action" onclick="exportTXT()">Export TXT</button>
      </div>
    </div>

    <!-- Output -->
    <div class="output-section">
      <div class="output-header">
        <span>Extracted Output</span>
        <span id="file-count">0 files loaded</span>
      </div>
      <textarea id="output-box" readonly placeholder="Loaded file names will appear here..."></textarea>
    </div>
  </div>

  <script>
    let rawFiles = [];

    const dropZone = document.getElementById('drop-zone');
    
    // Drag and drop handlers
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        handleFiles(files);
      }
    });

    function handleFiles(files) {
      rawFiles = Array.from(files);
      processFiles();
    }

    function processFiles() {
      if (rawFiles.length === 0) {
        document.getElementById('output-box').value = '';
        document.getElementById('file-count').textContent = '0 files loaded';
        return;
      }

      const includeExt = document.getElementById('chk-extension').checked;
      const shouldSort = document.getElementById('chk-sort').checked;

      let list = rawFiles.map(f => {
        let name = f.name;
        if (!includeExt) {
          const lastDot = name.lastIndexOf('.');
          if (lastDot > 0) name = name.substring(0, lastDot);
        }
        return name;
      });

      if (shouldSort) {
        list.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
      }

      document.getElementById('output-box').value = list.join('\n');
      document.getElementById('file-count').textContent = `${list.length} files loaded`;
    }

    function clearFiles() {
      rawFiles = [];
      document.getElementById('file-input').value = '';
      processFiles();
    }

    function copyToClipboard() {
      const box = document.getElementById('output-box');
      if (!box.value) {
        alert("No file names to copy.");
        return;
      }
      navigator.clipboard.writeText(box.value).then(() => {
        alert("File names copied to clipboard!");
      });
    }

    function exportTXT() {
      const box = document.getElementById('output-box');
      if (!box.value) {
        alert("No file names to export.");
        return;
      }
      const blob = new Blob([box.value], { type: 'text/plain;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `file_names_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
    }
  </script>
</body>
</html>
