<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight text-white">Imperial Units Calculator</h1>
            <p class="text-blue-100 text-sm mt-1">Add, Subtract, Multiply & Divide Feet, Inches & Fractions</p>
        </div>

        <!-- Calculator Body -->
        <div class="p-6 space-y-6">
            
            <!-- Unit 1 Input -->
            <div class="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                <label class="block text-sm font-medium text-slate-300 mb-2">First Measurement (Value A)</label>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Feet (ft)</label>
                        <input type="number" id="feet1" value="5" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Inches (in)</label>
                        <input type="number" id="inches1" value="7" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Fraction</label>
                        <select id="fraction1" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="0">0</option>
                            <option value="0.125">1/8</option>
                            <option value="0.25">1/4</option>
                            <option value="0.375">3/8</option>
                            <option value="0.5" selected>1/2</option>
                            <option value="0.625">5/8</option>
                            <option value="0.75">3/4</option>
                            <option value="0.875">7/8</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Operation Selector -->
            <div class="flex justify-center items-center gap-3">
                <button onclick="setOp('+')" id="btn-add" class="op-btn px-5 py-2.5 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg transition-all text-lg">+</button>
                <button onclick="setOp('-')" id="btn-sub" class="op-btn px-5 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 shadow-lg transition-all text-lg">-</button>
                <button onclick="setOp('*')" id="btn-mul" class="op-btn px-5 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 shadow-lg transition-all text-lg">×</button>
                <button onclick="setOp('/')" id="btn-div" class="op-btn px-5 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 shadow-lg transition-all text-lg">÷</button>
            </div>
            
            <!-- Unit 2 Input / Scalar for Multiply & Divide -->
            <div id="unit2-container" class="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                <label id="unit2-label" class="block text-sm font-medium text-slate-300 mb-2">Second Measurement (Value B)</label>
                
                <!-- Imperial Input Group -->
                <div id="imperial-inputs-2" class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Feet (ft)</label>
                        <input type="number" id="feet2" value="2" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Inches (in)</label>
                        <input type="number" id="inches2" value="3" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Fraction</label>
                        <select id="fraction2" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="0">0</option>
                            <option value="0.125">1/8</option>
                            <option value="0.25">1/4</option>
                            <option value="0.375">3/8</option>
                            <option value="0.5">1/2</option>
                            <option value="0.625" selected>5/8</option>
                            <option value="0.75">3/4</option>
                            <option value="0.875">7/8</option>
                        </select>
                    </div>
                </div>

                <!-- Scalar Input Group (Hidden by default) -->
                <div id="scalar-input-2" class="hidden">
                    <label class="block text-xs text-slate-400 mb-1">Scalar Number (Multiplier / Divisor)</label>
                    <input type="number" id="scalar2" value="2" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500" step="any">
                    <p class="text-xs text-slate-400 mt-1">Multiplication and Division operate between an Imperial measurement and a scalar factor.</p>
                </div>
            </div>

            <!-- Calculate Button -->
            <button onclick="calculate()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition-all">
                Calculate Result
            </button>

            <!-- Results Section -->
            <div class="bg-slate-900 border border-slate-700 p-5 rounded-xl space-y-3">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Calculation Results</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/50">
                        <span class="block text-xs text-slate-400">Formatted Imperial</span>
                        <span id="res-imperial" class="text-lg font-bold text-blue-400">-</span>
                    </div>
                    <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/50">
                        <span class="block text-xs text-slate-400">Total Inches</span>
                        <span id="res-inches" class="text-lg font-bold text-slate-200">-</span>
                    </div>
                    <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/50">
                        <span class="block text-xs text-slate-400">Decimal Feet / Metric</span>
                        <span id="res-decimal" class="text-lg font-bold text-slate-200">-</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Modal / Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-red-600 text-white px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 font-medium z-50">
        <span id="toast-msg">Error message</span>
    </div>

    <script>
        let currentOp = '+';

        function setOp(op) {
            currentOp = op;
            
            // Highlight active button
            ['+', '-', '*', '/'].forEach(o => {
                const btnId = 'btn-' + (o === '+' ? 'add' : o === '-' ? 'sub' : o === '*' ? 'mul' : 'div');
                const btn = document.getElementById(btnId);
                if(o === op) {
                    btn.className = "op-btn px-5 py-2.5 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg transition-all text-lg";
                } else {
                    btn.className = "op-btn px-5 py-2.5 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 shadow-lg transition-all text-lg";
                }
            });

            // Toggle Input UI based on operation
            const imperial2 = document.getElementById('imperial-inputs-2');
            const scalar2 = document.getElementById('scalar-input-2');
            const unit2Label = document.getElementById('unit2-label');

            if (op === '*' || op === '/') {
                imperial2.classList.add('hidden');
                scalar2.classList.remove('hidden');
                unit2Label.innerText = op === '*' ? 'Multiplier (Scalar)' : 'Divisor (Scalar)';
            } else {
                imperial2.classList.remove('hidden');
                scalar2.classList.add('hidden');
                unit2Label.innerText = 'Second Measurement (Value B)';
            }

            calculate();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function getInchesFromInput(fId, iId, frId) {
            const ft = parseFloat(document.getElementById(fId).value) || 0;
            const inc = parseFloat(document.getElementById(iId).value) || 0;
            const fr = parseFloat(document.getElementById(frId).value) || 0;
            return (ft * 12) + inc + fr;
        }

        function formatImperial(totalInches) {
            if (isNaN(totalInches)) return "Invalid Calculation";
            
            let isNegative = totalInches < 0;
            totalInches = Math.abs(totalInches);

            let totalFeet = Math.floor(totalInches / 12);
            let remInches = totalInches % 12;
            
            let inchesInt = Math.floor(remInches);
            let fractionPart = remInches - inchesInt;

            // Round fraction to nearest 1/8th
            let eighths = Math.round(fractionPart * 8);
            if (eighths === 8) {
                inchesInt += 1;
                eighths = 0;
            }
            if (inchesInt === 12) {
                totalFeet += 1;
                inchesInt = 0;
            }

            let fracStr = "";
            if (eighths === 1) fracStr = " 1/8\"";
            else if (eighths === 2) fracStr = " 1/4\"";
            else if (eighths === 3) fracStr = " 3/8\"";
            else if (eighths === 4) fracStr = " 1/2\"";
            else if (eighths === 5) fracStr = " 5/8\"";
            else if (eighths === 6) fracStr = " 3/4\"";
            else if (eighths === 7) fracStr = " 7/8\"";
            else fracStr = "\"";

            let result = `${totalFeet}'- ${inchesInt}${fracStr}`;
            return isNegative ? "-" + result : result;
        }

        function calculate() {
            try {
                let totalInches1 = getInchesFromInput('feet1', 'inches1', 'fraction1');
                let resultInches = 0;

                if (currentOp === '+') {
                    let totalInches2 = getInchesFromInput('feet2', 'inches2', 'fraction2');
                    resultInches = totalInches1 + totalInches2;
                } else if (currentOp === '-') {
                    let totalInches2 = getInchesFromInput('feet2', 'inches2', 'fraction2');
                    resultInches = totalInches1 - totalInches2;
                } else if (currentOp === '*') {
                    let scalar = parseFloat(document.getElementById('scalar2').value);
                    if (isNaN(scalar)) throw new Error("Please enter a valid multiplier");
                    resultInches = totalInches1 * scalar;
                } else if (currentOp === '/') {
                    let scalar = parseFloat(document.getElementById('scalar2').value);
                    if (isNaN(scalar) || scalar === 0) throw new Error("Divisor cannot be zero");
                    resultInches = totalInches1 / scalar;
                }

                // Update results display
                document.getElementById('res-imperial').innerText = formatImperial(resultInches);
                document.getElementById('res-inches').innerText = resultInches.toFixed(3) + " inches";
                
                let totalFeetDecimal = resultInches / 12;
                let cm = resultInches * 2.54;
                document.getElementById('res-decimal').innerText = `${totalFeetDecimal.toFixed(3)} ft (${cm.toFixed(1)} cm)`;

            } catch (err) {
                showToast(err.message);
            }
        }

        // Auto calculate on input change
        window.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('input', calculate);
                input.addEventListener('change', calculate);
            });
            calculate();
        });
    </script>
</body>
</html>
