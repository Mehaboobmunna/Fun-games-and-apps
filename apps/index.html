<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps · Project Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 0.5rem; }
    .back { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    .app-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s, border-color 0.2s;
    }
    .app-card:hover { transform: translateY(-2px); border-color: #38bdf8; }
    .app-card h2 { font-size: 1.15rem; color: #f1f5f9; margin-bottom: 0.25rem; }
    .app-card p { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <a href="../" class="back">&larr; Back to Home</a>
    <h1 style="margin-top: 1rem;">Web Apps</h1>
  </header>

  <div class="list">
    <!-- Tracker Entry -->
  <a href="./pulse/" class="app-card">
    <h2>⏱️ Pulse</h2>
    <p>Minimalist multi-project time tracker with start/stop intervals and CSV export.</p>
  </a>

    <!-- File Name Grabber Entry -->
    <a href="./file-name-grabber/" class="app-card">
      <h2>📁 File Name Grabber</h2>
      <p>Extract, clean, and format file names from local folders instantly.</p>
    </a>
  </div>
</body>
</html>
