<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Series Builder</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-6 text-white">
            <h1 class="text-2xl font-bold tracking-tight">Drawing Series Builder</h1>
            <p class="text-indigo-100 text-sm mt-1">Group sequential drawing numbers or filenames into clean, hyphenated ranges.</p>
        </div>

        <!-- Body Form -->
        <div class="p-6 space-y-6">
            <!-- File Upload Section -->
            <div class="bg-indigo-50/50 border-2 border-dashed border-indigo-200 rounded-xl p-8 text-center hover:bg-indigo-50 transition-all cursor-pointer relative" id="drop-zone">
                <input type="file" id="file-input" multiple accept=".pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="handleFilesSelect(this.files)">
                <div class="flex flex-col items-center justify-center space-y-3">
                    <svg class="w-12 h-12 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <div class="text-base font-semibold text-slate-700">Drop PDF drawing files here, or <span class="text-indigo-600 underline">browse PDF files</span></div>
                    <p class="text-xs text-slate-500">Only PDF drawing formats with numbering in filenames will be processed.</p>
                </div>
            </div>

            <!-- Uploaded Files Summary / Badge List -->
            <div id="files-summary-container" class="hidden">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-semibold text-slate-700" id="uploaded-count-label">Uploaded Files (0)</label>
                    <button onclick="clearFiles()" class="text-xs text-rose-600 font-medium hover:underline">Clear All</button>
                </div>
                <div id="files-badge-list" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    <!-- Dynamic badges here -->
                </div>
            </div>

            <!-- Options Section -->
            <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="sort-output" checked onchange="buildSeries()" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <label for="sort-output" class="text-sm font-medium text-slate-700">Sort numerically</label>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="remove-duplicates" checked onchange="buildSeries()" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <label for="remove-duplicates" class="text-sm font-medium text-slate-700">Remove duplicates</label>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="strip-ext" checked onchange="buildSeries()" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                    <label for="strip-ext" class="text-sm font-medium text-slate-700">Strip file extensions (.pdf, .dwg, etc.)</label>
                </div>
            </div>

            <!-- Output Section -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="output-string" class="block text-sm font-semibold text-slate-700">Output Series String</label>
                    <button onclick="copyOutput()" id="copy-btn" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-1 px-3 rounded-lg transition-all flex items-center space-x-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        <span id="copy-text">Copy Result</span>
                    </button>
                </div>
                <textarea id="output-string" rows="3" readonly
                    class="w-full rounded-xl border border-slate-300 bg-slate-50 p-3 text-sm font-mono text-indigo-900 focus:outline-none shadow-inner"
                    placeholder="Upload files above to generate series string..."></textarea>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="bg-slate-100 px-6 py-3 border-t border-slate-200 text-xs text-slate-500 flex justify-between items-center">
            <span>Drawing Series Builder v1.0</span>
            <span id="stats-info">Ready</span>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-sm flex items-center space-x-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <script>
        let currentFilenames = [];

        // Load default example files on start to demonstrate utility
        window.onload = function() {
            currentFilenames = [
                "C1000.pdf", "C1001.pdf", "C1002.pdf", "C1003.pdf", "C1004.pdf",
                "C1008.pdf", "C1009.pdf", "C1010.pdf", "C1015.pdf", "C1016.pdf",
                "C1029.pdf", "C1030.pdf", "C1031.pdf", "C1032.pdf", "C1044.pdf",
                "C1051.pdf", "C1062.pdf"
            ];
            updateFilesView();
            buildSeries();
        };

        function handleFilesSelect(files) {
            if (!files || files.length === 0) return;
            const pdfFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
            
            if (pdfFiles.length === 0) {
                showToast('Please select valid PDF files (.pdf)');
                return;
            }

            const newNames = pdfFiles.map(f => f.name);
            currentFilenames = currentFilenames.concat(newNames);
            updateFilesView();
            buildSeries();
            showToast(`${pdfFiles.length} PDF file(s) added successfully!`);
        }

        function clearFiles() {
            currentFilenames = [];
            updateFilesView();
            buildSeries();
            showToast('Cleared all files');
        }

        function updateFilesView() {
            const container = document.getElementById('files-summary-container');
            const badgeList = document.getElementById('files-badge-list');
            const countLabel = document.getElementById('uploaded-count-label');

            if (currentFilenames.length === 0) {
                container.classList.add('hidden');
                badgeList.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            countLabel.innerText = `Uploaded Files (${currentFilenames.length})`;
            
            badgeList.innerHTML = currentFilenames.map((name, idx) => `
                <span class="bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-md font-medium flex items-center space-x-1">
                    <span>${name}</span>
                    <button onclick="removeFile(${idx})" class="text-indigo-400 hover:text-rose-600 ml-1 font-bold">&times;</button>
                </span>
            `).join('');
        }

        function removeFile(index) {
            currentFilenames.splice(index, 1);
            updateFilesView();
            buildSeries();
        }

        function parseItem(item) {
            item = item.trim();
            if (!item) return null;
            
            const stripExt = document.getElementById('strip-ext').checked;
            if (stripExt) {
                // Remove standard file extensions like .pdf, .dwg, .png, .jpg, etc.
                item = item.replace(/\.[^/.]+$/, "");
            }

            // Match optional prefix letters/symbols followed by numbers
            const match = item.match(/^([A-Za-z_-]*?)(\d+)$/);
            if (match) {
                const prefix = match[1];
                const numStr = match[2];
                return {
                    original: item,
                    prefix: prefix,
                    num: parseInt(numStr, 10),
                    padding: numStr.length
                };
            } else {
                return {
                    original: item,
                    prefix: '',
                    num: NaN,
                    padding: 0
                };
            }
        }

        function buildSeries() {
            const sortOutput = document.getElementById('sort-output').checked;
            const removeDuplicates = document.getElementById('remove-duplicates').checked;

            let items = [];
            for (let name of currentFilenames) {
                const parsed = parseItem(name);
                if (parsed) {
                    items.push(parsed);
                }
            }

            if (items.length === 0) {
                document.getElementById('output-string').value = "";
                document.getElementById('stats-info').innerText = "0 files processed";
                return;
            }

            const groups = {};
            const unparsable = [];

            items.forEach(item => {
                if (isNaN(item.num)) {
                    unparsable.push(item.original);
                } else {
                    const key = item.prefix;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(item);
                }
            });

            let resultParts = [];

            Object.keys(groups).forEach(prefix => {
                let groupItems = groups[prefix];

                if (removeDuplicates) {
                    const seen = new Set();
                    groupItems = groupItems.filter(item => {
                        const identifier = item.prefix + item.num;
                        if (seen.has(identifier)) return false;
                        seen.add(identifier);
                        return true;
                    });
                }

                if (sortOutput) {
                    groupItems.sort((a, b) => a.num - b.num);
                }

                if (groupItems.length > 0) {
                    let rangeStart = groupItems[0];
                    let rangeEnd = groupItems[0];

                    for (let i = 1; i < groupItems.length; i++) {
                        const current = groupItems[i];
                        if (current.num === rangeEnd.num + 1 && current.padding === rangeEnd.padding) {
                            rangeEnd = current;
                        } else {
                            resultParts.push(formatRange(rangeStart, rangeEnd));
                            rangeStart = current;
                            rangeEnd = current;
                        }
                    }
                    resultParts.push(formatRange(rangeStart, rangeEnd));
                }
            });

            if (unparsable.length > 0) {
                const uniqueUnparsable = removeDuplicates ? [...new Set(unparsable)] : unparsable;
                resultParts.push(...uniqueUnparsable);
            }

            const finalOutput = resultParts.join(', ');
            document.getElementById('output-string').value = finalOutput;
            document.getElementById('stats-info').innerText = `Processed ${items.length} files into ${resultParts.length} tokens/ranges`;
        }

        function formatRange(startItem, endItem) {
            const formatNum = (num, padding) => {
                return String(num).padStart(padding, '0');
            };

            if (startItem.num === endItem.num) {
                return startItem.prefix + formatNum(startItem.num, startItem.padding);
            } else if (endItem.num === startItem.num + 1) {
                return startItem.prefix + formatNum(startItem.num, startItem.padding) + ', ' + endItem.prefix + formatNum(endItem.num, endItem.padding);
            } else {
                return startItem.prefix + formatNum(startItem.num, startItem.padding) + '-' + endItem.prefix + formatNum(endItem.num, endItem.padding);
            }
        }

        function copyOutput() {
            const outputBox = document.getElementById('output-string');
            outputBox.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Copied to clipboard!');
                }
            } catch (err) {
                console.error('Failed to copy text', err);
            }
        }

        function showToast(msg = 'Copied to clipboard!') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
