<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Series Builder</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#090d16',
                        cardBg: '#111726',
                        cardHover: '#172033',
                        cardActive: '#1e293b',
                        borderCol: '#1e293b',
                        borderFocus: '#3b82f6',
                        txt: '#f1f5f9',
                        textMuted: '#64748b',
                        accent: '#2563eb',
                        accentHover: '#1d4ed8',
                        accentLight: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Surfaces & Backgrounds */
            --bg: #090d16;
            --card-bg: rgba(17, 23, 38, 0.75);
            --card-hover: rgba(23, 32, 51, 0.85);
            --card-active: #1e293b;

            /* Borders & Dividers */
            --border: #1e293b;
            --border-focus: #3b82f6;

            /* Typography */
            --text: #f1f5f9;
            --text-muted: #64748b;

            /* Primary Brand Accents */
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #60a5fa;

            /* Semantic Alerts */
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;

            /* Geometry & Typography System */
            --radius: 8px;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body { 
            font-family: var(--font-sans); 
            background-color: var(--bg);
            color: var(--text);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
        }

        .glass-input:focus {
            border-color: var(--border-focus);
            outline: none;
        }

        .top-nav {
            margin-bottom: 1.5rem;
        }
        .top-nav a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .top-nav a:hover {
            color: var(--text);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

    <div class="w-full max-w-2xl">
        <!-- Navigation Button matching Hub style -->
        <nav class="top-nav">
            <a href="../">&larr; Back to Apps Hub</a>
        </nav>

        <div class="glass-card shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-700/80 to-blue-600/60 backdrop-blur-md p-6 text-white border-b border-blue-500/20">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Drawing Series Builder</h1>
                        <p class="text-blue-200 text-sm mt-1">Upload PDF drawing files to group sequential numbers into clean ranges.</p>
                    </div>
                    <div class="bg-white/10 p-3 rounded-xl backdrop-blur-md hidden sm:block">
                        <svg class="w-8 h-8 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Body Form -->
            <div class="p-6 space-y-6">
                <!-- File Upload Section (PDF Only) -->
                <div class="glass-card border-2 border-dashed border-slate-700/80 hover:border-blue-500 p-8 text-center transition-all cursor-pointer relative group" id="drop-zone">
                    <input type="file" id="file-input" multiple accept=".pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" onchange="handleFilesSelect(this.files)">
                    <div class="flex flex-col items-center justify-center space-y-3">
                        <div class="p-4 bg-blue-500/10 rounded-full group-hover:bg-blue-500/20 transition-all text-blue-400">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <div class="text-base font-semibold text-slate-200">Drop PDF drawing files here, or <span class="text-blue-400 underline">browse PDF files</span></div>
                        <p class="text-xs text-slate-400">Only .pdf drawing formats will be processed.</p>
                    </div>
                </div>

                <!-- Uploaded Files Summary (Quantity Only) -->
                <div id="files-summary-container" class="hidden">
                    <div class="flex justify-between items-center glass-input px-4 py-3">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span class="text-sm font-semibold text-slate-200" id="uploaded-count-label">Uploaded PDF Files: 0</span>
                        </div>
                        <button onclick="clearFiles()" class="text-xs text-rose-400 font-medium hover:underline">Clear All</button>
                    </div>
                </div>

                <!-- Options Section -->
                <div class="flex flex-wrap items-center justify-between gap-4 glass-card p-4 text-slate-300">
                    <div class="flex items-center space-x-6">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="sort-output" checked onchange="buildSeries()" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm font-medium">Sort numerically</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="remove-duplicates" checked onchange="buildSeries()" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500 h-4 w-4">
                            <span class="text-sm font-medium">Remove duplicates</span>
                        </label>
                    </div>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="strip-ext" checked onchange="buildSeries()" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500 h-4 w-4">
                        <span class="text-sm font-medium">Strip file extensions (.pdf)</span>
                    </label>
                </div>

                <!-- Output Section -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="output-string" class="block text-sm font-semibold text-slate-300">Output Series String</label>
                        <button onclick="copyOutput()" id="copy-btn" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-medium py-1.5 px-3 rounded-lg transition-all flex items-center space-x-1 border border-slate-700 shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            <span id="copy-text">Copy Result</span>
                        </button>
                    </div>
                    <textarea id="output-string" rows="3" readonly
                        class="w-full glass-input p-3 text-sm font-mono text-blue-300 shadow-inner"
                        placeholder="Upload PDF files above to generate series string..."></textarea>
                </div>
            </div>

            <!-- Footer Info -->
            <div class="bg-slate-950/40 px-6 py-3 border-t border-slate-800/60 text-xs text-slate-400 flex justify-between items-center backdrop-blur-md">
                <span>Drawing Series Builder v1.15</span>
                <span id="stats-info">Ready</span>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900/90 backdrop-blur-xl border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl shadow-xl text-sm flex items-center space-x-2 z-50">
        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <script>
        let currentFilenames = [];

        window.onload = function() {
            currentFilenames = [];
            updateFilesView();
            document.getElementById('output-string').value = "";
            document.getElementById('stats-info').innerText = "Ready";
        };

        function handleFilesSelect(files) {
            if (!files || files.length === 0) return;
            const pdfFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
            
            if (pdfFiles.length === 0) {
                showToast('Please select valid PDF files (.pdf)');
                return;
            }

            const newNames = pdfFiles.map(f => f.name);
            currentFilenames = currentFilenames.concat(newNames);
            updateFilesView();
            buildSeries();
            showToast(`${pdfFiles.length} PDF file(s) added successfully!`);
            document.getElementById('file-input').value = '';
        }

        function clearFiles() {
            currentFilenames = [];
            updateFilesView();
            document.getElementById('output-string').value = "";
            document.getElementById('stats-info').innerText = "Ready";
            showToast('Cleared all files');
            document.getElementById('file-input').value = '';
        }

        function updateFilesView() {
            const container = document.getElementById('files-summary-container');
            const countLabel = document.getElementById('uploaded-count-label');

            if (currentFilenames.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            countLabel.innerText = `Uploaded PDF Files: ${currentFilenames.length}`;
        }

        function parseItem(item) {
            item = (item || '').trim();
            if (!item) return null;
            
            const originalName = item;
            // Always strip .pdf / file extensions for internal structural parsing
            const baseItem = item.replace(/\.pdf$/i, "").replace(/\.[^/.]+$/, "").trim();

            // 1. Check if it's a pre-built range like HR5000-HR5029_A (second part MUST have prefix letters)
            const rangeMatch = baseItem.match(/^([A-Za-z]+)(\d+)\s*-\s*([A-Za-z]+)(\d+)(.*)$/);
            if (rangeMatch) {
                const prefix1 = rangeMatch[1];
                const num1 = parseInt(rangeMatch[2], 10);
                const num2 = parseInt(rangeMatch[4], 10);
                const remainder = (rangeMatch[5] || '').trim();
                const revMatch = remainder.match(/^_([A-Za-z0-9]+)$/);
                const revision = revMatch ? revMatch[1] : '';

                return {
                    original: originalName,
                    cleanName: baseItem,
                    isPrebuiltRange: true,
                    prefix: prefix1,
                    num: num1,
                    endNum: num2,
                    padding: rangeMatch[2].length,
                    sheetNum: null,
                    revision: revision
                };
            }

            // 2. Standard filename pattern matching:
            // Part 1: Prefix (Alphabets)
            // Part 2: 4-digit number (or general digits)
            // Part 3: Optional sheet number e.g. " - 1", "-1", " - 2"
            // Part 4: Optional Revision e.g. "_A", "_B", "_0"
            const match = baseItem.match(/^([A-Za-z]+)(\d+)(?:\s*-\s*(\d+))?(?:_([A-Za-z0-9]+))?$/);
            
            if (match) {
                const prefix = match[1];
                const numStr = match[2];
                const sheetStr = match[3];
                const revision = match[4] || '';

                return {
                    original: originalName,
                    cleanName: baseItem,
                    isPrebuiltRange: false,
                    prefix: prefix,
                    num: parseInt(numStr, 10),
                    padding: numStr.length,
                    sheetNum: sheetStr !== undefined ? parseInt(sheetStr, 10) : null,
                    revision: revision
                };
            } else {
                return {
                    original: originalName,
                    cleanName: baseItem,
                    isPrebuiltRange: false,
                    prefix: '',
                    num: NaN,
                    padding: 0,
                    sheetNum: null,
                    revision: ''
                };
            }
        }

        function formatSingleItem(item, stripExt) {
            if (isNaN(item.num)) {
                return stripExt ? item.cleanName : item.original;
            }
            const numPart = String(item.num).padStart(item.padding, '0');
            const sheetPart = (item.sheetNum !== null && item.sheetNum > 0) ? ` - ${item.sheetNum}` : '';
            const revPart = item.revision ? `_${item.revision}` : '';
            const extPart = (!stripExt && item.original.toLowerCase().endsWith('.pdf')) ? '.pdf' : '';
            return `${item.prefix}${numPart}${sheetPart}${revPart}${extPart}`;
        }

        function buildSeries() {
            if (currentFilenames.length === 0) {
                document.getElementById('output-string').value = "";
                document.getElementById('stats-info').innerText = "Ready";
                return;
            }

            const sortOutput = document.getElementById('sort-output').checked;
            const removeDuplicates = document.getElementById('remove-duplicates').checked;
            const stripExt = document.getElementById('strip-ext').checked;

            let rawItems = [];
            for (let name of currentFilenames) {
                // Support comma-separated lists if a user uploads or tests batch names
                const parts = name.split(',').map(s => s.trim()).filter(Boolean);
                for (let part of parts) {
                    const parsed = parseItem(part);
                    if (parsed) {
                        rawItems.push(parsed);
                    }
                }
            }

            if (rawItems.length === 0) {
                document.getElementById('output-string').value = "";
                document.getElementById('stats-info').innerText = "0 files processed";
                return;
            }

            // Expand prebuilt ranges into individual items for evaluation and sorting
            let expandedItems = [];
            rawItems.forEach(item => {
                if (item.isPrebuiltRange) {
                    const extSuffix = item.original.toLowerCase().endsWith('.pdf') ? '.pdf' : '';
                    for (let n = item.num; n <= item.endNum; n++) {
                        const base = item.prefix + String(n).padStart(item.padding, '0') + (item.revision ? '_' + item.revision : '');
                        expandedItems.push({
                            original: base + extSuffix,
                            cleanName: base,
                            isPrebuiltRange: false,
                            prefix: item.prefix,
                            num: n,
                            padding: item.padding,
                            sheetNum: null,
                            revision: item.revision
                        });
                    }
                } else {
                    expandedItems.push(item);
                }
            });

            // Identify base numbers that have sub-sheets (e.g. -1, -2) for any prefix + num combo.
            // Rule: If a sub-sheet (sheetNum > 0) is found, both it and its main sheet (sheetNum === null) must NOT be grouped.
            const subSheetBaseMap = {}; // key: "prefix|num" -> boolean
            expandedItems.forEach(item => {
                if (!isNaN(item.num) && item.sheetNum !== null && item.sheetNum > 0) {
                    const baseKey = `${item.prefix.toUpperCase()}|${item.num}`;
                    subSheetBaseMap[baseKey] = true;

                    // Ensure corresponding main sheet is present if it came from a range or was implied
                    const mainSheetExists = expandedItems.some(ex =>
                        ex.prefix.toUpperCase() === item.prefix.toUpperCase() &&
                        ex.num === item.num &&
                        ex.sheetNum === null &&
                        ex.revision === item.revision
                    );
                    if (!mainSheetExists) {
                        const extSuffix = item.original.toLowerCase().endsWith('.pdf') ? '.pdf' : '';
                        const base = item.prefix + String(item.num).padStart(item.padding, '0') + (item.revision ? '_' + item.revision : '');
                        expandedItems.push({
                            original: base + extSuffix,
                            cleanName: base,
                            isPrebuiltRange: false,
                            prefix: item.prefix,
                            num: item.num,
                            padding: item.padding,
                            sheetNum: null,
                            revision: item.revision
                        });
                    }
                }
            });

            // Deduplicate items based on canonical structure (prefix, number, sheetNum, revision)
            if (removeDuplicates) {
                const seen = new Set();
                expandedItems = expandedItems.filter(item => {
                    const key = isNaN(item.num)
                        ? item.cleanName
                        : `${item.prefix.toUpperCase()}|${item.num}|${item.sheetNum === null ? 0 : item.sheetNum}|${item.revision}`;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            }

            const compareFn = (a, b) => {
                if (!a || !b) return 0;
                const prefixA = (a.prefix || '').toUpperCase();
                const prefixB = (b.prefix || '').toUpperCase();
                // 1. Sort by alphanumeric prefix first (alphabetical)
                if (prefixA !== prefixB) return prefixA.localeCompare(prefixB);
                
                // 2. Sort by 4-digit number succeeding the alphanumeric character
                const numA = isNaN(a.num) ? 0 : a.num;
                const numB = isNaN(b.num) ? 0 : b.num;
                if (numA !== numB) return numA - numB;

                // 3. Additional sheets ordering (main sheet 0 comes before -1, -2)
                const sheetA = a.sheetNum !== null ? a.sheetNum : 0;
                const sheetB = b.sheetNum !== null ? b.sheetNum : 0;
                if (sheetA !== sheetB) return sheetA - sheetB;

                // 4. Revision ordering
                const revA = a.revision || '';
                const revB = b.revision || '';
                return revA.localeCompare(revB);
            };

            if (sortOutput) {
                expandedItems.sort(compareFn);
            }

            // Build ranges linearly in sorted order so 2 consecutive numbers stay comma-separated
            // and 3+ consecutive groupable numbers form a hyphenated range
            let outputTokens = [];
            let i = 0;

            const isGroupable = (item) => {
                if (!item || isNaN(item.num)) return false;
                if (item.sheetNum !== null) return false;
                const baseKey = `${item.prefix.toUpperCase()}|${item.num}`;
                if (subSheetBaseMap[baseKey]) return false;
                return true;
            };

            while (i < expandedItems.length) {
                const current = expandedItems[i];

                if (!isGroupable(current)) {
                    outputTokens.push({
                        text: formatSingleItem(current, stripExt),
                        sortRef: current
                    });
                    i++;
                } else {
                    // Find how many consecutive groupable items share the same prefix, revision, and padding
                    let j = i;
                    while (j + 1 < expandedItems.length) {
                        const nextItem = expandedItems[j + 1];
                        const prevItem = expandedItems[j];
                        if (
                            isGroupable(nextItem) &&
                            nextItem.prefix.toUpperCase() === current.prefix.toUpperCase() &&
                            nextItem.revision === current.revision &&
                            nextItem.padding === current.padding &&
                            nextItem.num === prevItem.num + 1
                        ) {
                            j++;
                        } else {
                            break;
                        }
                    }

                    const runLength = j - i + 1;
                    if (runLength >= 3) {
                        // 3 or more consecutive numbers -> Hyphenated range
                        const startItem = expandedItems[i];
                        const endItem = expandedItems[j];
                        const startNumStr = String(startItem.num).padStart(startItem.padding, '0');
                        const endNumStr = String(endItem.num).padStart(endItem.padding, '0');
                        const revPart = startItem.revision ? `_${startItem.revision}` : '';
                        const extPart = (!stripExt && startItem.original.toLowerCase().endsWith('.pdf')) ? '.pdf' : '';
                        outputTokens.push({
                            text: `${startItem.prefix}${startNumStr}-${endItem.prefix}${endNumStr}${revPart}${extPart}`,
                            sortRef: startItem
                        });
                    } else {
                        // 1 or 2 consecutive numbers -> Keep comma-separated as individual tokens
                        for (let k = i; k <= j; k++) {
                            outputTokens.push({
                                text: formatSingleItem(expandedItems[k], stripExt),
                                sortRef: expandedItems[k]
                            });
                        }
                    }
                    i = j + 1;
                }
            }

            if (sortOutput) {
                outputTokens.sort((a, b) => compareFn(a.sortRef, b.sortRef));
            }

            const finalOutput = outputTokens.map(t => t.text).join(', ');
            document.getElementById('output-string').value = finalOutput;
            document.getElementById('stats-info').innerText = `Processed ${currentFilenames.length} files into ${outputTokens.length} tokens/ranges`;
        }

        function copyOutput() {
            const outputBox = document.getElementById('output-string');
            if (!outputBox.value.trim()) {
                showToast('Nothing to copy yet!');
                return;
            }
            outputBox.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Copied to clipboard!');
                }
            } catch (err) {
                console.error('Failed to copy text', err);
            }
        }

        function showToast(msg = 'Copied to clipboard!') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
